<app-page-template title="Create list">
  <section class="create-list">
    <form class="create-list__form" [formGroup]="form" (ngSubmit)="onSave()">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>
        <textarea matInput rows="4" formControlName="description"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Entity type (optional)</mat-label>
        <input matInput formControlName="entityType" placeholder="e.g. movie, book" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Visibility</mat-label>
        <mat-select formControlName="visibility">
          <mat-option value="private">Private</mat-option>
          <mat-option value="public">Public</mat-option>
        </mat-select>
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit">Create</button>
      <a mat-button routerLink="/lists">Cancel</a>
    </form>

    @if (saveError) {
      <p class="create-list__error">{{ saveError }}</p>
    }
  </section>

  @if (saveResult$ | async) {}
</app-page-template>
